name: 출처 확인 (임시)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node tools/probe_summary.js
      - run: tar czf - o | base64 -w0 > b64.txt && echo BEGIN && cat b64.txt && echo && echo END
