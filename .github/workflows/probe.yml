name: 출처 확인 (임시)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir o && cd o
          J=https://api.jolpi.ca/ergast/f1
          curl -s -m 30 "$J/2026.json" -o j_2026.json
          curl -s -m 30 "$J/2027.json" -o j_2027.json
          curl -s -m 30 "$J/2026/constructorstandings.json" -o j_cs.json
          curl -s -m 30 "$J/2026/driverstandings.json" -o j_ds.json
          curl -s -m 30 "$J/2026/results.json?limit=100" -o j_res.json
          curl -s -m 30 "$J/2026/sprint.json?limit=100" -o j_spr.json
          curl -s -m 30 "$J/2026/qualifying.json?limit=100" -o j_q.json
          curl -s -m 30 "$J/2026/constructors.json" -o j_con.json
          curl -s -m 30 "https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard" -o e_sb.json
          curl -s -m 30 "https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard?dates=2026" -o e_2026.json
          ls -la; head -c 600 j_2026.json; echo
          cd .. && tar czf - o | base64 -w0 > b64.txt && echo BEGIN && cat b64.txt && echo && echo END
